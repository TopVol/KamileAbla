<!doctype html><html lang=tr><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Touch Stars V2</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#081220;color:#fff;font-family:-apple-system,Arial}#c{width:100%;height:100%;display:block;touch-action:none}#u{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;z-index:2}#u b{flex:1;background:#ffffff18;padding:10px;border-radius:16px;text-align:center}#o{position:fixed;inset:0;display:grid;place-items:center;background:#0008;z-index:3}#card{width:min(88vw,360px);background:#0b1a31dd;border:1px solid #ffffff22;border-radius:24px;padding:22px;text-align:center}button{width:100%;padding:14px;border:0;border-radius:999px;background:#ffd76a;font-weight:800;margin-top:12px}</style><div id=u><b>Skor <span id=s>0</span></b><b>Can <span id=l>3</span></b><b>Rekor <span id=r>0</span></b></div><canvas id=c></canvas><div id=o><div id=card><h1>Yildiz Topla ✨</h1><p>iPhone Safari icin dokunmatik oyun.</p><p>Yildizlar daha buyuk. Meteorlar daha kucuk, daha yavas ve daha seyrek.</p><button id=b>Baslat</button></div></div><script>let c=document.getElementById('c'),x=c.getContext('2d'),w,h,d=Math.min(2,devicePixelRatio||1),run=0,t=0,S=[],E=[],P=[],pt={x:0,y:0,a:0},pl={x:0,y:0,r:18},sc=0,li=3,hi=+localStorage.tsv2best||0;s.textContent=hi;function rs(){w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);if(!pl.x){pl.x=w/2;pl.y=h*.72}}function R(a,b){return Math.random()*(b-a)+a}function D(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function star(){S.push({x:R(28,w-28),y:R(100,h-24),r:R(16,22),p:R(0,6.28)})}function enemy(){let q=Math.random()<.5?-20:w+20;E.push({x:q,y:R(100,h-20),r:R(9,14),vx:q<0?R(.7,1.6):R(-1.6,-.7),vy:R(-.45,.45)})}function burst(x0,y0,c0,n=12){for(let i=0;i<n;i++)P.push({x:x0,y:y0,vx:R(-2.5,2.5),vy:R(-2.5,2.5),l:R(18,34),c:c0})}function reset(){sc=0;li=3;s.textContent=sc;l.textContent=li;S=[];E=[];P=[];pl.x=w/2;pl.y=h*.72;for(let i=0;i<5;i++)star();for(let i=0;i<2;i++)enemy();run=1;o.style.display='none'}function end(){run=0;hi=Math.max(hi,sc);localStorage.tsv2best=hi;r.textContent=hi;o.style.display='grid';card.querySelector('h1').textContent='Oyun Bitti';card.querySelectorAll('p')[0].textContent='Skor: '+sc+'  Rekor: '+hi;card.querySelectorAll('p')[1].textContent='Yine dene.';b.textContent='Tekrar Baslat'}function up(){if(!run)return;t++;if(pt.a){pl.x+=(pt.x-pl.x)*.17;pl.y+=(pt.y-pl.y)*.17}pl.x=Math.max(pl.r,Math.min(w-pl.r,pl.x));pl.y=Math.max(92+pl.r,Math.min(h-pl.r,pl.y));if(S.length<5&&Math.random()<.028)star();if(E.length<3+Math.floor(sc/12)&&Math.random()<.008)enemy();for(let v of S)v.p+=.08;for(let v of E){v.x+=v.vx;v.y+=v.vy;if(v.y<96||v.y>h-20)v.vy*=-1}for(let i=E.length-1;i>=0;i--){let v=E[i];if(v.x<-36||v.x>w+36){E.splice(i,1);enemy();continue}if(D(pl,v)<pl.r+v.r){E.splice(i,1);burst(pl.x,pl.y,'#ff5d5d',20);li--;l.textContent=li;pl.x=w/2;pl.y=h*.72;enemy();if(li<=0)return end()}}for(let i=S.length-1;i>=0;i--){if(D(pl,S[i])<pl.r+S[i].r){burst(S[i].x,S[i].y,'#ffd76a');S.splice(i,1);sc++;s.textContent=sc;star();if(sc%8==0)enemy()}}for(let i=P.length-1;i>=0;i--){let v=P[i];v.x+=v.vx;v.y+=v.vy;v.l--;if(v.l<=0)P.splice(i,1)}}function shape(a,b,r0){x.beginPath();for(let i=0;i<5;i++){let A=i*Math.PI*2/5-Math.PI/2,x1=a+Math.cos(A)*r0,y1=b+Math.sin(A)*r0,x2=a+Math.cos(A+Math.PI/5)*r0*.46,y2=b+Math.sin(A+Math.PI/5)*r0*.46;i?x.lineTo(x1,y1):x.moveTo(x1,y1);x.lineTo(x2,y2)}x.closePath()}function dr(){let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#17345c');g.addColorStop(1,'#060c16');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<50;i++){x.globalAlpha=.25+(i%4)*.12;x.fillStyle='#fff';x.fillRect((i*83)%w,(i*47+t*.12)%h,2,2)}x.globalAlpha=1;for(let v of S){x.save();x.shadowBlur=20;x.shadowColor='#ffd76a';x.fillStyle='#ffd76a';shape(v.x,v.y,v.r+Math.sin(v.p)*1.8);x.fill();x.restore()}for(let v of E){x.save();x.shadowBlur=12;x.shadowColor='#ff5d5d';x.fillStyle='#ff5d5d';x.beginPath();x.arc(v.x,v.y,v.r,0,7);x.fill();x.restore()}for(let v of P){x.globalAlpha=Math.max(0,v.l/34);x.fillStyle=v.c;x.fillRect(v.x,v.y,4,4)}x.globalAlpha=1;if(pt.a&&run){x.globalAlpha=.18;x.fillStyle='#69e6ff';x.beginPath();x.arc(pt.x,pt.y,26,0,7);x.fill();x.globalAlpha=1}x.save();x.translate(pl.x,pl.y);x.shadowBlur=22;x.shadowColor='#69e6ff';x.fillStyle='#69e6ff';x.beginPath();x.arc(0,0,pl.r,0,7);x.fill();x.restore()}function loop(){up();dr();requestAnimationFrame(loop)}function setp(e){let t0=e.touches?e.touches[0]:e;pt.x=t0.clientX;pt.y=t0.clientY;pt.a=1}c.addEventListener('touchstart',e=>{e.preventDefault();setp(e)},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();setp(e)},{passive:false});c.addEventListener('touchend',()=>pt.a=0);c.addEventListener('mousedown',setp);c.addEventListener('mousemove',e=>{if(e.buttons)setp(e)});addEventListener('mouseup',()=>pt.a=0);b.onclick=reset;addEventListener('resize',rs);rs();loop();</script>
