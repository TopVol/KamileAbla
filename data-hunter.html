<!doctype html><html lang=tr><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Data Hunter</title><style>html,body{margin:0;height:100%;background:#0a0f1f;color:#fff;font-family:-apple-system,Arial}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px}#hud div{flex:1;background:#ffffff18;padding:10px;border-radius:12px;text-align:center}#target{position:fixed;top:70px;width:100%;text-align:center;font-weight:bold}#game{position:absolute;top:120px;bottom:0;width:100%;display:flex;flex-wrap:wrap;gap:8px;padding:10px}button{flex:1 1 45%;padding:14px;border-radius:10px;border:1px solid #ffffff22;background:#111a33;color:#fff}#overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center}#card{background:#111;padding:20px;border-radius:20px;text-align:center}</style><div id=hud><div>Skor <span id=s>0</span></div><div>Can <span id=l>3</span></div><div>Zeit <span id=t>30</span></div></div><div id=target></div><div id=game></div><div id=overlay><div id=card><h1>Data Hunter</h1><p>Doğru dosyayı bul</p><button onclick=start()>Başlat</button></div></div><script>let files=[],target='',score=0,lives=3,time=30,run=0;const types=['report','backup','log','config'];function rand(a,b){return Math.floor(Math.random()*(b-a)+a)}function gen(){let t=types[rand(0,types.length)];return t+'_'+rand(2020,2027)+'_v'+rand(1,5)+'.txt'}function round(){files=[];target=gen();files.push(target);for(let i=0;i<5;i++)files.push(gen());files.sort(()=>Math.random()-0.5);document.getElementById('target').innerText='Find: '+target;let g=document.getElementById('game');g.innerHTML='';files.forEach(f=>{let b=document.createElement('button');b.innerText=f;b.onclick=()=>click(f);g.appendChild(b)})}function click(f){if(!run)return;if(f===target){score+=100}else{lives--}update();if(lives<=0)return end();round()}function update(){s.innerText=score;l.innerText=lives;t.innerText=time}function tick(){if(!run)return;time--;update();if(time<=0)return end();setTimeout(tick,1000)}function start(){score=0;lives=3;time=30;run=1;overlay.style.display='none';update();round();tick()}function end(){run=0;overlay.style.display='flex';card.innerHTML='<h1>Game Over</h1><p>Skor: '+score+'</p><button onclick=start()>Tekrar</button>'}</script>
