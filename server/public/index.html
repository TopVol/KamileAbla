<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiplayer Test</title>
<style>
body{margin:0;background:#08101d;color:white;font-family:sans-serif}
canvas{display:block;margin:auto;background:#0b1220}
</style>
</head>
<body>
<canvas id="c" width="400" height="400"></canvas>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io("http://localhost:3000");
const c = document.getElementById('c');
const x = c.getContext('2d');

let me = null;
let players = [];

socket.on("init", data => {
  me = data.id;
});

socket.on("world", data => {
  players = data.players;
  draw();
});

function draw(){
  x.clearRect(0,0,400,400);
  players.forEach(p => {
    x.fillStyle = p.color;
    x.fillRect(p.x*5, p.y*5, 5,5);
  });
}

window.addEventListener("keydown", e => {
  if(e.key === "ArrowUp" || e.key === "w") socket.emit("move","up");
  if(e.key === "ArrowDown" || e.key === "s") socket.emit("move","down");
  if(e.key === "ArrowLeft" || e.key === "a") socket.emit("move","left");
  if(e.key === "ArrowRight" || e.key === "d") socket.emit("move","right");
});
</script>
</body>
</html>
