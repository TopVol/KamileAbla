<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiplayer v2</title>
<style>
body{margin:0;background:#08101d;color:white;font-family:sans-serif;text-align:center}
canvas{display:block;margin:20px auto;background:#0b1220;border-radius:12px}
input,button{padding:10px;margin:5px;border-radius:8px;border:none}
</style>
</head>
<body>
<h2>Multiplayer Test v2</h2>
<input id="name" placeholder="Name">
<button onclick="setName()">Set Name</button>
<button onclick="respawn()">Respawn</button>
<canvas id="c" width="480" height="360"></canvas>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io("http://localhost:3000");
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let players = [];
let me = null;

socket.on("init", data => { me = data.id; });
socket.on("world", data => { players = data.players; draw(); });

function setName(){ socket.emit("setName", document.getElementById("name").value); }
function respawn(){ socket.emit("respawn"); }

function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  players.forEach(p=>{
    ctx.strokeStyle = p.color;
    ctx.beginPath();
    p.trail.forEach((t,i)=>{
      if(i===0) ctx.moveTo(t.x*5, t.y*5);
      else ctx.lineTo(t.x*5, t.y*5);
    });
    ctx.stroke();

    ctx.fillStyle = p.color;
    ctx.fillRect(p.x*5, p.y*5, 6,6);

    ctx.fillStyle = "white";
    ctx.fillText(p.name, p.x*5, p.y*5-5);

    if(!p.alive){
      ctx.fillStyle = "red";
      ctx.fillText("X", p.x*5, p.y*5);
    }
  });
}

window.addEventListener("keydown", e => {
  if(e.key==='ArrowUp'||e.key==='w') socket.emit('move','up');
  if(e.key==='ArrowDown'||e.key==='s') socket.emit('move','down');
  if(e.key==='ArrowLeft'||e.key==='a') socket.emit('move','left');
  if(e.key==='ArrowRight'||e.key==='d') socket.emit('move','right');
});
</script>
</body>
</html>
