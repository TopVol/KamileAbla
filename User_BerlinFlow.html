<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Berlin Flow</title><style>:root{--bg:#0f1220;--bg2:#171c31;--panel:#1c223d;--txt:#eef3ff;--muted:#a8b3d6;--good:#63e6be;--warn:#ffd166;--bad:#ff6b6b;--accent:#7c9cff;--neon:#8ef0ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:linear-gradient(180deg,var(--bg),#0a0d18);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}body{display:flex;justify-content:center}#app{width:100%;max-width:520px;min-height:100%;position:relative;background:radial-gradient(circle at top,#222b4f 0%,#101525 56%,#090c16 100%)}#top{position:sticky;top:0;z-index:5;padding:10px;background:linear-gradient(180deg,rgba(15,18,32,.96),rgba(15,18,32,.78));backdrop-filter:blur(8px)}.row{display:flex;gap:8px}.pill{flex:1;background:#ffffff10;border:1px solid #ffffff14;border-radius:14px;padding:10px;text-align:center;font-weight:700}.small{font-size:12px;color:var(--muted)}#screen{padding:12px 12px 110px}.card{background:var(--panel);border:1px solid #ffffff14;border-radius:24px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.22);margin-bottom:12px}.title{font-size:28px;font-weight:900;margin:0 0 6px}.subtitle{color:var(--muted);margin:0 0 8px;line-height:1.38}.scene{min-height:240px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(180deg,#232c4d,#151b31);border-radius:22px;border:1px solid #ffffff12}.sceneInner{text-align:center;padding:18px}.sceneIcon{font-size:54px;filter:drop-shadow(0 0 14px rgba(142,240,255,.25))}.sceneTitle{font-size:24px;font-weight:900;margin-top:10px}.sceneText{margin-top:8px;color:var(--muted);line-height:1.35}.meter{height:16px;background:#0b1020;border-radius:999px;overflow:hidden;border:1px solid #ffffff14}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--neon));width:40%}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{border:none;border-radius:16px;padding:15px 16px;font-weight:900;font-size:16px;color:#fff;background:linear-gradient(90deg,#7c9cff,#5f7dff)}.btn2{background:linear-gradient(90deg,#63e6be,#36d39a);color:#062218}.btn3{background:linear-gradient(90deg,#ffd166,#ffb347);color:#1e1605}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#131933;border:1px solid #ffffff18;color:#fff;padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;z-index:20}.overlay{position:fixed;inset:0;background:rgba(7,10,18,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:15}.modal{width:min(92vw,430px);background:var(--panel);border:1px solid #ffffff14;border-radius:26px;padding:22px;text-align:center}.big{font-size:36px;font-weight:900;margin:8px 0}.badge{display:inline-block;background:#ffffff10;border:1px solid #ffffff14;padding:7px 10px;border-radius:999px;margin-top:8px;color:var(--muted)}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}</style></head><body><div id="app"><div id="top"><div class="row"><div class="pill"><div class="small">Flow</div><div id="flowVal">40</div></div><div class="pill"><div class="small">Streak</div><div id="streakVal">0</div></div><div class="pill"><div class="small">Zeit</div><div id="timeVal">45</div></div></div></div><div id="screen"></div></div><div class="toast" id="toast"></div><div class="overlay" id="overlay"><div class="modal" id="modal"><div class="title">Berlin Flow</div><p class="subtitle">Kleine Wege, große Momente. Reagiere im richtigen Moment und halte deinen Berliner Tagesfluss stabil.</p><div class="badge">One-Tap • Urban • Cozy Reflex</div><div style="height:12px"></div><button class="btn" id="startBtn">Flow starten</button></div></div><script>const els={screen:document.getElementById('screen'),flow:document.getElementById('flowVal'),streak:document.getElementById('streakVal'),time:document.getElementById('timeVal'),toast:document.getElementById('toast'),overlay:document.getElementById('overlay'),modal:document.getElementById('modal'),start:document.getElementById('startBtn')};const state={flow:40,streak:0,time:45,score:0,best:+localStorage.User_BerlinFlow_best||0,level:1,phase:'scene',scene:null,timer:null};const scenes=[{key:'bahn',icon:'🚇',title:'Die U-Bahn rollt ein',text:'Tür piept, Leute strömen, der Moment ist kurz.',a:{label:'Jetzt einsteigen',type:'good'},b:{label:'Noch warten',type:'bad'}},{key:'ampel',icon:'🚦',title:'Die Ampel kippt gleich',text:'Du willst rüber, aber nur im guten Timing.',a:{label:'Ruhig warten',type:'good'},b:{label:'Zu früh los',type:'bad'}},{key:'coffee',icon:'☕',title:'Kaffee-Fenster entdeckt',text:'Kurzer Halt oder direkt weiter im Flow?',a:{label:'Schnell holen',type:'good'},b:{label:'Im Chaos vertrödeln',type:'bad'}},{key:'delay',icon:'🟨',title:'BVG meldet Delay',text:'Kleine Berliner Prüfung. Improvisation oder Frust?',a:{label:'Locker umplanen',type:'good'},b:{label:'Genervt festhängen',type:'bad'}},{key:'rain',icon:'🌦️',title:'Plötzlicher Nieselregen',text:'Ein kleiner urbaner Plot-Twist.',a:{label:'Weiterziehen',type:'good'},b:{label:'Flow verlieren',type:'bad'}},{key:'street',icon:'🚲',title:'Radfahrer kommt quer',text:'Ein Moment für Reflex und Gelassenheit.',a:{label:'Kurz ausweichen',type:'good'},b:{label:'Verhaken',type:'bad'}}];function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rnd(arr){return arr[Math.floor(Math.random()*arr.length)]}function toast(msg){els.toast.textContent=msg;els.toast.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>els.toast.style.opacity=0,1600)}function startGame(){state.flow=40;state.streak=0;state.time=45;state.score=0;state.level=1;nextScene();tick();render();els.overlay.style.display='none'}function tick(){clearInterval(state.timer);state.timer=setInterval(()=>{state.time--;els.time.textContent=state.time;if(state.time<=0)endGame()},1000)}function nextScene(){state.scene=JSON.parse(JSON.stringify(rnd(scenes)));if(state.level>3&&Math.random()<0.35){state.scene.icon='🚧';state.scene.title='Baustelle blockiert kurz';state.scene.text='Berlin wirft dir eine kleine Umleitung hin.';state.scene.a={label:'Kurz anpassen',type:'good'};state.scene.b={label:'Flow zerreden',type:'bad'}}state.phase='scene';render()}function outcome(type){if(state.phase!=='scene')return;let deltaFlow=0,deltaTime=0,deltaScore=0,msg='';if(type==='good'){state.streak++;deltaFlow=8+Math.min(8,state.streak);deltaTime=2;deltaScore=80+state.streak*12;msg=state.streak>=4?'Sauberer Stadtfluss':'Guter Move'}else{state.streak=0;deltaFlow=-14;deltaTime=-2;deltaScore=10;msg='Berlin hat kurz zurückgebissen'}state.flow=clamp(state.flow+deltaFlow,0,100);state.time=clamp(state.time+deltaTime,0,99);state.score+=deltaScore;els.time.textContent=state.time;toast(msg);state.phase='result';state.result={type,deltaFlow,deltaTime,deltaScore,text:analysis(type)};render()}function analysis(type){if(type==='good')return state.flow>75?'Du gleitest fast lo-fi elegant durch die Stadt.':'Gutes Timing, ruhiger Rhythmus, sauber gehalten.';return state.flow<20?'Der Flow bröckelt. Jetzt wieder kleine klare Entscheidungen.':'Kein Drama, nur ein kleiner Berliner Stolperstein.'}function nextRound(){state.level++;if(state.flow<=0)return endGame();nextScene()}function endGame(){clearInterval(state.timer);if(state.score>state.best){state.best=state.score;localStorage.User_BerlinFlow_best=state.best}els.overlay.style.display='flex';els.modal.innerHTML=`<div class="title">Tag vorbei</div><div class="big">${state.score}</div><p class="subtitle">Bestwert: ${state.best}<br>Flow am Ende: ${state.flow}<br>Streak-Höhepunkt: ${Math.max(state.streak,0)}</p><button class="btn2 btn" id="againBtn">Neuen Tag starten</button>`;document.getElementById('againBtn').onclick=startGame}function render(){els.flow.textContent=state.flow;els.streak.textContent=state.streak;els.time.textContent=state.time;let html='';if(state.phase==='scene'){const f=state.flow;html=`<div class="card"><div class="title">${state.scene.title}</div><p class="subtitle">Level ${state.level} · urbaner Tagesmodus</p><div class="scene"><div class="sceneInner"><div class="sceneIcon">${state.scene.icon}</div><div class="sceneTitle">${state.scene.key==='bahn'?'Timing zählt':state.scene.key==='coffee'?'Kurzer Halt':state.scene.key==='delay'?'Ruhe bewahren':'Bleib im Takt'}</div><div class="sceneText">${state.scene.text}</div></div></div><div style="height:12px"></div><div class="small">Flow-Meter</div><div class="meter"><div class="fill" style="width:${f}%"></div></div><div class="actions"><button class="btn2 btn" id="aBtn">${state.scene.a.label}</button><button class="btn3 btn" id="bBtn">${state.scene.b.label}</button></div></div><div class="card"><p class="subtitle">Berliner Alltage sind kleine Taktspiele. Nicht perfekt sein. Nur im Rhythmus bleiben.</p></div>`}else if(state.phase==='result'){const cls=state.result.type==='good'?'good':'bad';const dt=state.result.deltaTime>0?`+${state.result.deltaTime}`:`${state.result.deltaTime}`;html=`<div class="card"><div class="title">Auswertung</div><div class="big ${cls}">${state.result.type==='good'?'Flow steigt':'Flow sinkt'}</div><p class="subtitle">${state.result.text}</p><div class="row"><div class="pill">Punkte<br><b>+${state.result.deltaScore}</b></div><div class="pill">Flow<br><b>${state.result.deltaFlow>0?'+':''}${state.result.deltaFlow}</b></div><div class="pill">Zeit<br><b>${dt}</b></div></div><div style="height:12px"></div><button class="btn" id="nextBtn">Nächste Szene</button></div>`}els.screen.innerHTML=html;const a=document.getElementById('aBtn');if(a)a.onclick=()=>outcome(state.scene.a.type);const b=document.getElementById('bBtn');if(b)b.onclick=()=>outcome(state.scene.b.type);const n=document.getElementById('nextBtn');if(n)n.onclick=nextRound}els.start.onclick=startGame;render();</script></body></html>
