<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Neon Territory</title><style>body{margin:0;background:#0a0f1f;color:#fff;font-family:Arial}#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000a}#box{background:#111;padding:20px;border-radius:20px;text-align:center}input{padding:10px;border-radius:10px;border:none;margin-top:10px}button{margin-top:10px;padding:10px 15px;border-radius:10px;border:none;background:#6ea8fe;color:#fff}canvas{display:block}</style></head><body><div id='login'><div id='box'><h2>Neon Territory</h2><input id='name' placeholder='Dein Name'><br><button onclick='start()'>Start</button></div></div><canvas id='game'></canvas><script>let name='';function start(){name=document.getElementById('name').value||'Player';document.getElementById('login').style.display='none';init()}function init(){let c=document.getElementById('game');let ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let x=200,y=200;function loop(){ctx.fillStyle='#0a0f1f';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#6ea8fe';ctx.fillRect(x,y,10,10);requestAnimationFrame(loop)}loop()}</script></body></html>
