<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamile Abla - Yildiz Toplama</title>
  <style>
    :root {
      --bg1: #0b1020;
      --bg2: #1b2a4a;
      --accent: #ffd166;
      --accent2: #72ddf7;
      --danger: #ff6b6b;
      --text: #f7f7ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #22345c 0%, var(--bg1) 55%, #05070f 100%);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .wrap {
      width: min(94vw, 900px);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 4vw, 3rem);
      letter-spacing: 1px;
    }
    p {
      margin: 8px 0 14px;
      opacity: .9;
    }
    .hud {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .pill {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      padding: 10px 16px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    canvas {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, #1e2f57, #0b1020 70%);
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
    }
    .controls {
      margin-top: 14px;
      font-size: .95rem;
      opacity: .9;
    }
    .cta {
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Kamile Abla: Yildiz Toplama</h1>
    <p>Uzayda gez, yildizlari topla, kirmizi meteorlardan kac. Basit ama tatli bir tarayici oyunu ✨</p>
    <div class="hud">
      <div class="pill">Skor: <span id="score">0</span></div>
      <div class="pill">Can: <span id="lives">3</span></div>
      <div class="pill">En iyi: <span id="best">0</span></div>
    </div>
    <canvas id="game" width="960" height="540"></canvas>
    <div class="controls">
      <span class="cta">Hareket:</span> Yön tuşlari / WASD &nbsp; | &nbsp;
      <span class="cta">Baslat / Tekrar:</span> Space
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const bestEl = document.getElementById('best');

    const W = canvas.width, H = canvas.height;
    const keys = {};
    let gameRunning = false;
    let score = 0;
    let lives = 3;
    let best = Number(localStorage.getItem('kamileAblaBest') || 0);
    bestEl.textContent = best;

    const player = {
      x: 120, y: H / 2, r: 18, speed: 4.5,
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = '#72ddf7';
        ctx.beginPath();
        ctx.moveTo(24, 0); ctx.lineTo(-16, -14); ctx.lineTo(-6, 0); ctx.lineTo(-16, 14);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.arc(-3, 0, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      },
      update() {
        if (keys['ArrowUp'] || keys['w']) this.y -= this.speed;
        if (keys['ArrowDown'] || keys['s']) this.y += this.speed;
        if (keys['ArrowLeft'] || keys['a']) this.x -= this.speed;
        if (keys['ArrowRight'] || keys['d']) this.x += this.speed;
        this.x = Math.max(this.r, Math.min(W - this.r, this.x));
        this.y = Math.max(this.r, Math.min(H - this.r, this.y));
      }
    };

    const stars = [];
    const meteors = [];
    const particles = [];

    function rand(min, max) { return Math.random() * (max - min) + min; }

    function spawnStar() {
      stars.push({ x: rand(80, W - 40), y: rand(40, H - 40), r: 12, pulse: rand(0, Math.PI * 2) });
    }

    function spawnMeteor() {
      const side = Math.random() < 0.5 ? -30 : W + 30;
      meteors.push({
        x: side,
        y: rand(20, H - 20),
        r: rand(16, 28),
        vx: side < 0 ? rand(2.2, 5.2) : rand(-5.2, -2.2),
        vy: rand(-1.4, 1.4)
      });
    }

    function burst(x, y, color, amount = 14) {
      for (let i = 0; i < amount; i++) {
        particles.push({ x, y, vx: rand(-3, 3), vy: rand(-3, 3), life: rand(20, 40), color });
      }
    }

    function resetGame() {
      score = 0;
      lives = 3;
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      player.x = 120; player.y = H / 2;
      stars.length = 0; meteors.length = 0; particles.length = 0;
      for (let i = 0; i < 4; i++) spawnStar();
      for (let i = 0; i < 3; i++) spawnMeteor();
      gameRunning = true;
    }

    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

    function update() {
      if (!gameRunning) return;
      player.update();

      if (stars.length < 4 && Math.random() < 0.02) spawnStar();
      if (meteors.length < 8 + Math.floor(score / 8) && Math.random() < 0.03) spawnMeteor();

      for (const s of stars) s.pulse += 0.08;
      for (const m of meteors) {
        m.x += m.vx;
        m.y += m.vy;
        if (m.y < m.r || m.y > H - m.r) m.vy *= -1;
      }

      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        if (m.x < -60 || m.x > W + 60) meteors.splice(i, 1), spawnMeteor();
        else if (dist(player, m) < player.r + m.r) {
          meteors.splice(i, 1);
          lives--;
          livesEl.textContent = lives;
          burst(player.x, player.y, '#ff6b6b', 20);
          player.x = 120; player.y = H / 2;
          if (lives <= 0) {
            gameRunning = false;
            best = Math.max(best, score);
            localStorage.setItem('kamileAblaBest', best);
            bestEl.textContent = best;
          } else spawnMeteor();
        }
      }

      for (let i = stars.length - 1; i >= 0; i--) {
        if (dist(player, stars[i]) < player.r + stars[i].r) {
          burst(stars[i].x, stars[i].y, '#ffd166');
          stars.splice(i, 1);
          score++;
          scoreEl.textContent = score;
          spawnStar();
          if (score % 5 === 0) spawnMeteor();
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 1;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, W, H);
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#213764');
      g.addColorStop(1, '#09101f');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 70; i++) {
        const x = (i * 137) % W;
        const y = (i * 73) % H;
        ctx.globalAlpha = 0.25 + (i % 5) * 0.08;
        ctx.fillStyle = '#fff';
        ctx.fillRect(x, y, 2, 2);
      }
      ctx.globalAlpha = 1;
    }

    function draw() {
      drawBackground();

      for (const s of stars) {
        const glow = 10 + Math.sin(s.pulse) * 3;
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ffd166';
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a = i * Math.PI * 2 / 5 - Math.PI / 2;
          const r1 = s.r + glow * 0.18;
          const r2 = s.r * 0.45;
          const x1 = s.x + Math.cos(a) * r1;
          const y1 = s.y + Math.sin(a) * r1;
          const x2 = s.x + Math.cos(a + Math.PI / 5) * r2;
          const y2 = s.y + Math.sin(a + Math.PI / 5) * r2;
          if (i === 0) ctx.moveTo(x1, y1); else ctx.lineTo(x1, y1);
          ctx.lineTo(x2, y2);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      for (const m of meteors) {
        ctx.save();
        ctx.fillStyle = '#ff6b6b';
        ctx.shadowBlur = 16;
        ctx.shadowColor = '#ff6b6b';
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffdede';
        ctx.beginPath();
        ctx.arc(m.x - m.r * 0.3, m.y - m.r * 0.2, m.r * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / 40);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
      }
      ctx.globalAlpha = 1;

      player.draw();

      if (!gameRunning) {
        ctx.fillStyle = 'rgba(0,0,0,.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 44px Arial';
        ctx.fillText(score === 0 ? 'Hazirsan Basla' : 'Oyun Bitti', W / 2, H / 2 - 20);
        ctx.font = '24px Arial';
        ctx.fillText(score === 0 ? 'Space tusuna bas' : `Skor: ${score}  |  Tekrar icin Space`, W / 2, H / 2 + 28);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.code === 'Space') {
        e.preventDefault();
        if (!gameRunning) resetGame();
      }
    });

    window.addEventListener('keyup', e => { keys[e.key] = false; });

    loop();
  </script>
</body>
</html>
