<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Neon Territory</title><link rel='stylesheet' href='style.css'></head><body><div class='app'><div id='hud'><div class='row'><div class='pill'><div class='small'>Name</div><div id='pname'>-</div></div><div class='pill'><div class='small'>Status</div><div id='status'>Alive</div></div></div></div><div id='gameWrap'><canvas id='game'></canvas></div></div><div class='overlay' id='overlay'><div class='modal'><div class='title'>Neon Territory</div><p class='sub'>Claim your space. Stay alive. Build your area.</p><input id='nameInput' placeholder='Dein Name'><div class='tog'><input type='checkbox' id='bots'> Bots aktivieren</div><button class='btn' onclick='startGame()'>Start</button></div></div><script>function startGame(){let name=document.getElementById('nameInput').value||'Player';document.getElementById('pname').innerText=name;document.getElementById('overlay').style.display='none'}</script><script src='game.js'></script></body></html>
