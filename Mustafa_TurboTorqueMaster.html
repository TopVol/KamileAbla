<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Turbo Torque Master</title><style>:root{--bg:#0b1020;--panel:#141b33;--soft:#1c2547;--txt:#eef3ff;--muted:#9fb0d9;--good:#63e6be;--warn:#ffd166;--bad:#ff6b6b;--accent:#6ea8fe}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:linear-gradient(180deg,#0a0f1d,#10182f);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}body{display:flex;justify-content:center}#app{width:100%;max-width:520px;min-height:100%;position:relative;background:radial-gradient(circle at top,#1a2550 0%,#0b1020 56%,#070b15 100%)}#top{position:sticky;top:0;z-index:5;padding:10px;background:linear-gradient(180deg,rgba(11,16,32,.98),rgba(11,16,32,.78));backdrop-filter:blur(8px)}.row{display:flex;gap:8px}.pill{flex:1;background:#ffffff12;border:1px solid #ffffff14;border-radius:14px;padding:10px;text-align:center;font-weight:700}.small{font-size:12px;color:var(--muted)}#screen{padding:12px 12px 92px}.card{background:var(--panel);border:1px solid #ffffff14;border-radius:22px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);margin-bottom:12px}.title{font-size:26px;font-weight:900;margin:0 0 6px}.subtitle{color:var(--muted);margin:0 0 8px;line-height:1.35}.label{font-size:13px;color:var(--muted);margin-bottom:6px}.meter{height:14px;background:#0b1020;border-radius:999px;overflow:hidden;border:1px solid #ffffff14}.fill{height:100%;width:50%;background:linear-gradient(90deg,var(--accent),#8ec5ff)}.sliderWrap{margin:12px 0}.val{font-weight:800}.target{font-size:15px;line-height:1.4;background:#ffffff08;padding:10px;border-radius:14px;border:1px solid #ffffff12}.btn{border:none;border-radius:16px;padding:14px 16px;font-weight:900;font-size:16px;background:linear-gradient(90deg,#7fb0ff,#5c8fff);color:white;width:100%}.btn2{background:linear-gradient(90deg,#ffd166,#ffb347);color:#1d1603}.btn3{background:linear-gradient(90deg,#63e6be,#3dd9a4);color:#062218}.ghost{background:#ffffff10}.range{width:100%}#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111933;border:1px solid #ffffff18;color:#fff;padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}#overlay{position:fixed;inset:0;background:rgba(5,9,18,.72);display:flex;align-items:center;justify-content:center;padding:16px}#modal{width:min(92vw,420px);background:var(--panel);border:1px solid #ffffff14;border-radius:26px;padding:20px;text-align:center}.score{font-size:34px;font-weight:900;margin:10px 0}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}</style></head><body><div id="app"><div id="top"><div class="row"><div class="pill"><div class="small">Punkte</div><div id="score">0</div></div><div class="pill"><div class="small">Level</div><div id="level">1</div></div><div class="pill"><div class="small">Zeit</div><div id="time">45</div></div></div></div><div id="screen"></div></div><div id="toast"></div><div id="overlay"><div id="modal"><div class="title">Turbo Torque Master</div><p class="subtitle">Mustafas mobiles Tuning-Arcade. Werte justieren, perfekten Start treffen und die Challenge knacken.</p><button class="btn" id="startBtn">Spiel starten</button></div></div><script>const els={screen:document.getElementById('screen'),score:document.getElementById('score'),level:document.getElementById('level'),time:document.getElementById('time'),toast:document.getElementById('toast'),overlay:document.getElementById('overlay'),modal:document.getElementById('modal'),startBtn:document.getElementById('startBtn')};const state={score:0,level:1,time:45,timer:null,phase:'setup',setup:{torque:50,pressure:50,gear:50},target:{torque:50,pressure:50,gear:50},lastSetupScore:0,best:+localStorage.Mustafa_TurboTorqueMaster_best||0};function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function toast(msg){els.toast.textContent=msg;els.toast.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>els.toast.style.opacity=0,1600)}function startGame(){state.score=0;state.level=1;state.time=45;newLevel();tick();render();els.overlay.style.display='none'}function tick(){clearInterval(state.timer);state.timer=setInterval(()=>{state.time--;els.time.textContent=state.time;if(state.time<=0)endGame()},1000)}function newLevel(){const spread=Math.max(10,28-state.level*2);state.target={torque:r(50-spread,50+spread),pressure:r(50-spread,50+spread),gear:r(50-spread,50+spread)};state.setup={torque:50,pressure:50,gear:50};state.phase='setup';state.lastSetupScore=0;render()}function diffScore(a,b){return Math.abs(a-b)}function calcSetupScore(){const d1=diffScore(state.setup.torque,state.target.torque),d2=diffScore(state.setup.pressure,state.target.pressure),d3=diffScore(state.setup.gear,state.target.gear);const penalty=d1+d2+d3;return clamp(100-penalty,0,100)}function finishSetup(){const s=calcSetupScore();state.lastSetupScore=s;state.phase='launch';render();if(s>=85)toast('Sehr starkes Setup');else if(s>=65)toast('Ordentlich abgestimmt');else toast('Setup ist wackelig')}function launchResult(kind){if(state.phase!=='launch')return;let timingBonus=kind==='perfect'?45:kind==='good'?25:8;let gained=state.lastSetupScore*4+timingBonus+state.level*10;state.score+=gained;if(kind==='perfect')state.time+=4;else if(kind==='good')state.time+=2;state.time=clamp(state.time,0,99);state.phase='result';state.result={kind,gained,total:state.score,analysis:analysisText(kind)};render()}function analysisText(kind){const s=state.lastSetupScore;let a=[];if(s>84)a.push('Setup sehr nah am Ziel.');else if(s>64)a.push('Setup brauchbar, aber nicht perfekt.');else a.push('Setup hatte deutliche Abweichungen.');if(kind==='perfect')a.push('Startpunkt fast ideal getroffen.');else if(kind==='good')a.push('Start war solide.');else a.push('Timing hat viel Performance liegen lassen.');return a.join(' ')}function nextRound(){state.level++;newLevel()}function endGame(){clearInterval(state.timer);if(state.score>state.best){state.best=state.score;localStorage.Mustafa_TurboTorqueMaster_best=state.best}els.overlay.style.display='flex';els.modal.innerHTML=`<div class="title">Game Over</div><div class="score">${state.score}</div><p class="subtitle">Bestwert: ${state.best}<br>Du hast ${state.level} Setups gespielt.</p><button class="btn3 btn" id="again">Nochmal fahren</button>`;document.getElementById('again').onclick=startGame}function slider(name,label,color){const v=state.setup[name];const t=state.target[name];return `<div class="sliderWrap"><div class="row" style="align-items:end"><div class="label">${label}</div><div style="margin-left:auto" class="val">${v}</div></div><div class="meter"><div class="fill" style="width:${v}%;background:${color}"></div></div><input class="range" type="range" min="0" max="100" value="${v}" data-k="${name}"></div><div class="small">Zielbereich: <span class="val">${t}</span></div>`}function render(){els.score.textContent=state.score;els.level.textContent=state.level;els.time.textContent=state.time;let html='';if(state.phase==='setup'){html=`<div class="card"><div class="title">Werkstatt</div><p class="subtitle">Passe das Fahrzeug an die Zielwerte an. Je näher du dran bist, desto mehr Punkte holst du später.</p><div class="target">Ziel-Setup Level ${state.level}<br>Drehmoment <b>${state.target.torque}</b> · Reifendruck <b>${state.target.pressure}</b> · Übersetzung <b>${state.target.gear}</b></div>${slider('torque','Drehmoment','linear-gradient(90deg,#7fb0ff,#5c8fff)')}${slider('pressure','Reifendruck','linear-gradient(90deg,#ffd166,#ffb347)')}${slider('gear','Übersetzung','linear-gradient(90deg,#63e6be,#3dd9a4)')}<button class="btn" id="lockBtn">Setup abschließen</button></div><div class="card"><div class="label">Mustafa-Mode</div><p class="subtitle">Technik schlägt Zufall. Präzision in der Werkstatt ist dein halber Sieg.</p></div>`}else if(state.phase==='launch'){html=`<div class="card"><div class="title">Start-Challenge</div><p class="subtitle">Setup-Wertung: <b>${state.lastSetupScore}/100</b>. Jetzt den richtigen Start treffen.</p><div class="row"><button class="btn3 btn" id="perfect">Perfekter Start</button></div><div style="height:8px"></div><div class="row"><button class="btn2 btn" id="good">Guter Start</button></div><div style="height:8px"></div><div class="row"><button class="ghost btn" id="late">Zu spät / zu früh</button></div></div><div class="card"><p class="subtitle">Perfekt gibt den höchsten Bonus und extra Zeit. So wird aus einem guten Setup ein Bestwert-Monster.</p></div>`}else if(state.phase==='result'){const cls=state.result.kind==='perfect'?'good':state.result.kind==='good'?'warn':'bad';html=`<div class="card"><div class="title">Auswertung</div><div class="score ${cls}">+${state.result.gained}</div><p class="subtitle">${state.result.analysis}</p><div class="target">Gesamtpunkte: <b>${state.result.total}</b><br>Setup: <b>${state.lastSetupScore}/100</b><br>Startqualität: <b>${state.result.kind}</b></div><div style="height:10px"></div><button class="btn" id="nextBtn">Nächste Challenge</button></div>`}els.screen.innerHTML=html;els.screen.querySelectorAll('input[type=range]').forEach(inp=>inp.oninput=e=>{state.setup[e.target.dataset.k]=+e.target.value;render()});const lock=document.getElementById('lockBtn');if(lock)lock.onclick=finishSetup;const p=document.getElementById('perfect');if(p)p.onclick=()=>launchResult('perfect');const g=document.getElementById('good');if(g)g.onclick=()=>launchResult('good');const l=document.getElementById('late');if(l)l.onclick=()=>launchResult('late');const n=document.getElementById('nextBtn');if(n)n.onclick=nextRound}els.startBtn.onclick=startGame;render();</script></body></html>
